<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智適應速算系統 - 正式 POC 版</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        .hidden { display: none !important; }
        .role-btn { display: block; width: 100%; padding: 15px; margin: 15px 0; font-size: 1.2em; background-color: #f8f9fa; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .role-btn:hover { border-color: #3498db; background-color: #ebf5fb; }
        .level-badge { background-color: #3498db; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9em; margin-bottom: 20px; display: inline-block; }
        .question-box { font-size: 2.5em; font-weight: bold; margin: 20px 0; color: #2c3e50; }
        input[type="number"] { font-size: 1.5em; padding: 10px; width: 60%; text-align: center; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 15px; }
        button.action-btn { font-size: 1.1em; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; margin: 5px; }
        .btn-submit { background-color: #2ecc71; }
        .btn-back { background-color: #95a5a6; }
        .feedback { margin-top: 20px; font-size: 1.1em; min-height: 50px; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
        .hint { color: #d35400; font-size: 0.95em; margin-top: 10px; background: #fdfae6; padding: 12px; border-radius: 5px; text-align: left; }
        .alert-item { background-color: #fbeeee; border-left: 5px solid #e74c3c; padding: 15px; margin-bottom: 12px; text-align: left;}
        .timer { font-size: 0.9em; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>

<!-- 登入選擇 -->
<div class="container" id="login-view">
    <h2>智適應速算系統 Demo</h2>
    <button class="role-btn" onclick="switchView('student-view')">👨‍🎓 進入「學生練習端」</button>
    <button class="role-btn" onclick="switchView('teacher-dashboard')">👨‍🏫 進入「教師異常雷達」</button>
</div>

<!-- 學生端 -->
<div class="container hidden" id="student-view">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="level-badge" id="level-display" style="margin:0;">目前難度: 基礎雙位數</span>
        <button class="action-btn btn-back" style="padding: 5px 10px;" onclick="switchView('login-view')">登出</button>
    </div>
    
    <div class="question-box" id="question-text">載入中...</div>
    
    <input type="number" id="answer-input" placeholder="請輸入答案" onkeypress="if(event.key==='Enter') checkAnswer()">
    <br>
    <button class="action-btn btn-submit" onclick="checkAnswer()">提交答案</button>
    
    <div class="timer" id="timer-display">作答計時中...</div>
    <div class="feedback" id="feedback-area"></div>
</div>

<!-- 教師端 -->
<div class="container hidden" id="teacher-dashboard">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">📊 教師異常雷達</h2>
        <button class="action-btn btn-back" style="padding: 5px 10px;" onclick="switchView('login-view')">登出</button>
    </div>
    <h4 style="color: #2c3e50; text-align: left;">⚠️ 系統自動標記名單：</h4>
    <div id="alerts-area"></div>
</div>

<script>
    let currentLevel = 1; // 1: 基礎, 2: 挑戰
    let streak = 0;
    let mistakes = 0;
    let currentCorrectAnswer = 0;
    let currentType = 0;
    let currentQText = "";
    let teacherAlerts = [];
    let startTime;
    let timerInterval;

    function switchView(viewId) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if (viewId === 'student-view') generateQuestion();
        if (viewId === 'teacher-dashboard') updateTeacherDashboard();
    }

    function startTimer() {
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let seconds = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer-display').innerText = `已用時: ${seconds} 秒`;
        }, 1000);
    }

    function generateQuestion() {
        document.getElementById('feedback-area').innerHTML = "";
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        startTimer();

        // 隨機決定題型：0為乘加，1為乘減，2為99乘法
        currentType = Math.floor(Math.random() * 3);

        if (currentType === 0) {
            // 【滿足要求 1：動態生成無限組 A × B + A × C】
            let a = Math.floor(Math.random() * 8) + 2;
            let b = Math.floor(Math.random() * 9) + 1;
            let c = 10 - b;
            currentQText = `${a} × ${b} + ${a} × ${c}`;
            currentCorrectAnswer = a * (b + c);
        } else if (currentType === 1) {
            // 【滿足要求 2：梯級式自適應 - 乘減混合】
            if (currentLevel === 1) {
                // 基礎題雙位數 (如 13 × 8 - 13 × 5)
                let a = 13; let b = 8; let c = 5;
                currentQText = `${a} × ${b} - ${a} × ${c}`;
                currentCorrectAnswer = a * (b - c);
            } else {
                // 升級百位數 (如 123 × 125 - 43 × 125)
                let a = 125; let b = 123; let c = 43;
                currentQText = `${b} × ${a} - ${c} × ${a}`;
                currentCorrectAnswer = a * (b - c);
            }
        } else {
            // 特定題型：99 × 某數
            let a = 15;
            currentQText = `99 × ${a}`;
            currentCorrectAnswer = 99 * a;
        }
        document.getElementById('question-text').innerText = currentQText;
    }

    function checkAnswer() {
        clearInterval(timerInterval);
        let timeTaken = Math.floor((Date.now() - startTime) / 1000);
        let inputVal = document.getElementById('answer-input').value;
        if (inputVal === "") return;
        
        let userAnswer = parseInt(inputVal);
        let feedback = document.getElementById('feedback-area');

        // 【滿足要求 3：耗時過長偵測 (超過15秒)】
        if (timeTaken > 15) {
            let alertMsg = `⏱️ 學生在題型 [${currentQText}] 耗時過長 (${timeTaken}秒)。`;
            if (!teacherAlerts.includes(alertMsg)) teacherAlerts.push(alertMsg);
        }

        if (userAnswer === currentCorrectAnswer) {
            streak++; mistakes = 0;
            feedback.innerHTML = `<span class="correct">✅ 答對了！(用時 ${timeTaken} 秒)</span>`;
            
            // 【滿足要求 2：自動升級挑戰】
            if (streak >= 2 && currentLevel === 1) {
                currentLevel = 2; streak = 0;
                feedback.innerHTML += `<br><span class="correct">🌟 表現優異！題目自動提升至百位數挑戰</span>`;
                let lvlBadge = document.getElementById('level-display');
                lvlBadge.innerText = "目前難度: 挑戰百位數";
                lvlBadge.style.backgroundColor = "#9b59b6";
            }
            setTimeout(generateQuestion, 1500);
        } else {
            streak = 0; mistakes++;
            
            // 【滿足要求 3：連續答錯 3 次偵測】
            if (mistakes >= 3) {
                let alertMsg = `❌ 學生在目前階段連續答錯 3 次，需老師協助跟進。`;
                if (!teacherAlerts.includes(alertMsg)) teacherAlerts.push(alertMsg);
            }

            // 【滿足要求 2：降級與專屬鷹架輔助】
            let hintHtml = `<span class="wrong">❌ 答錯了。</span>`;
            if (currentType === 2) {
                hintHtml += `<div class="hint">💡 <b>提示：</b>試從算式中『自製』整十或整百數，將 99 改寫成 <b>(100 - 1)</b> 來計算喔！</div>`;
            } else if (currentType === 1) {
                hintHtml += `<div class="hint">💡 <b>提示：</b>試著利用分配性質，抽出共同的數字來相減。</div>`;
            } else {
                hintHtml += `<div class="hint">💡 <b>提示：</b>試著把相乘的數字合併相加。</div>`;
            }
            feedback.innerHTML = hintHtml;
        }
    }

    function updateTeacherDashboard() {
        let alertsArea = document.getElementById('alerts-area');
        if (teacherAlerts.length === 0) {
            alertsArea.innerHTML = "<div style='color:green;'>✅ 目前無異常名單。</div>";
        } else {
            alertsArea.innerHTML = teacherAlerts.map(a => `<div class="alert-item">${a}</div>`).join('');
        }
    }
</script>
</body>
</html>
