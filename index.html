<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智適應速算系統 MVP Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .hidden {
            display: none !important;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        /* 角色選擇畫面 */
        .role-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.2em;
            background-color: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .role-btn:hover {
            border-color: #3498db;
            background-color: #ebf5fb;
        }

        /* 學生端介面 */
        .level-badge {
            background-color: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 20px;
        }
        .question-box {
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
            color: #2c3e50;
        }
        input[type="number"] {
            font-size: 1.5em;
            padding: 10px;
            width: 60%;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }
        button.action-btn {
            font-size: 1.1em;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
            color: white;
        }
        .btn-submit { background-color: #2ecc71; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-back { background-color: #95a5a6; }
        .btn-back:hover { background-color: #7f8c8d; }
        
        .feedback {
            margin-top: 20px;
            font-size: 1.1em;
            min-height: 50px;
        }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
        .hint { color: #d35400; font-size: 0.95em; margin-top: 10px; background: #fdfae6; padding: 12px; border-radius: 5px; text-align: left;}
        
        /* 教師端介面 */
        #teacher-dashboard {
            text-align: left;
        }
        .alert-item {
            background-color: #fbeeeeb3;
            border-left: 5px solid #e74c3c;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 0 4px 4px 0;
        }
        .empty-state {
            color: #27ae60;
            text-align: center;
            padding: 30px;
            background: #e9f7ef;
            border-radius: 8px;
        }
        .stat-box {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- 1. 登入/角色選擇畫面 -->
<div class="container" id="login-view">
    <h2>智適應速算系統 Demo</h2>
    <p style="color: #7f8c8d; margin-bottom: 30px;">請選擇您的登入身分</p>
    
    <button class="role-btn" onclick="switchView('student-view')">
        👨‍🎓 進入「學生練習端」<br>
        <span style="font-size: 0.7em; color: #7f8c8d;">體驗 AI 自動派題與提示</span>
    </button>
    
    <button class="role-btn" onclick="switchView('teacher-dashboard')">
        👨‍🏫 進入「教師數據端」<br>
        <span style="font-size: 0.7em; color: #7f8c8d;">檢視異常學生雷達報告</span>
    </button>
</div>

<!-- 2. 學生端畫面 -->
<div class="container hidden" id="student-view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="level-badge" id="level-display">目前難度: Level 1 (基礎)</span>
        <button class="action-btn btn-back" style="font-size: 0.8em; padding: 5px 10px;" onclick="switchView('login-view')">登出</button>
    </div>
    
    <div class="question-box" id="question-text">載入中...</div>
    
    <input type="number" id="answer-input" placeholder="請輸入答案" autocomplete="off" onkeypress="handleEnter(event)">
    <br>
    <button class="action-btn btn-submit" onclick="checkAnswer()">提交答案</button>
    
    <div class="feedback" id="feedback-area"></div>
</div>

<!-- 3. 教師端畫面 -->
<div class="container hidden" id="teacher-dashboard">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">📊 教師異常雷達</h2>
        <button class="action-btn btn-back" style="font-size: 0.8em; padding: 5px 10px;" onclick="switchView('login-view')">登出</button>
    </div>
    
    <div class="stat-box">
        <div><strong>目前連線學生:</strong> 1 人</div>
        <div><strong>單元:</strong> 乘加混合計算</div>
    </div>

    <h4 style="color: #2c3e50;">⚠️ 系統自動標記名單：</h4>
    <div id="alerts-area"></div>
</div>

<script>
    // 系統狀態變數
    let currentLevel = 1;
    let streak = 0;
    let mistakes = 0;
    let currentCorrectAnswer = 0;
    let currentA, currentB, currentC;
    let teacherAlerts = [];
    let studentId = "學生 Demo (陳小明)";

    // 視圖切換邏輯
    function switchView(viewId) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('student-view').classList.add('hidden');
        document.getElementById('teacher-dashboard').classList.add('hidden');
        
        document.getElementById(viewId).classList.remove('hidden');

        if (viewId === 'student-view') {
            generateQuestion(); // 進入學生端時刷新題目
        } else if (viewId === 'teacher-dashboard') {
            updateTeacherDashboard(); // 進入教師端時刷新數據
        }
    }

    // 產生題目 (動態題庫)
    function generateQuestion() {
        if (currentLevel === 1) {
            // Level 1: 基礎難度 (B+C=10)
            currentA = Math.floor(Math.random() * 8) + 2; // 2-9
            currentB = Math.floor(Math.random() * 9) + 1; // 1-9
            currentC = 10 - currentB;
        } else {
            // Level 2: 進階難度 (B+C=100)
            currentA = Math.floor(Math.random() * 89) + 11; // 11-99
            currentB = Math.floor(Math.random() * 79) + 11; // 11-89
            currentC = 100 - currentB;
        }

        const qText = `${currentA} × ${currentB} + ${currentA} × ${currentC}`;
        currentCorrectAnswer = currentA * (currentB + currentC);
        
        document.getElementById('question-text').innerText = qText;
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
    }

    // 檢查答案 (自適應升降級與提示)
    function checkAnswer() {
        const inputVal = document.getElementById('answer-input').value;
        const feedback = document.getElementById('feedback-area');
        
        if (inputVal === "") return;

        const userAnswer = parseInt(inputVal);

        if (userAnswer === currentCorrectAnswer) {
            streak++;
            mistakes = 0;
            feedback.innerHTML = `<span class="correct">✅ 答對了！</span>`;
            
            // 升級邏輯
            if (streak >= 2 && currentLevel === 1) {
                currentLevel = 2;
                streak = 0;
                feedback.innerHTML += `<br><span class="correct">🌟 表現優異！系統自動升級挑戰 (Level 2)</span>`;
                document.getElementById('level-display').innerText = "目前難度: Level 2 (進階)";
                document.getElementById('level-display').style.backgroundColor = "#9b59b6"; // 變色提示
            }
            
            setTimeout(() => {
                feedback.innerHTML = "";
                generateQuestion();
            }, 1500);

        } else {
            streak = 0;
            mistakes++;
            feedback.innerHTML = `<span class="wrong">❌ 答錯了。</span>
                                  <div class="hint">💡 <b>AI 鷹架輔助：</b><br>試著利用乘法分配性質，將算式改寫成 <b>${currentA} × (${currentB} + ${currentC})</b> 會更好算喔！</div>`;
            
            // 教師雷達邏輯
            if (mistakes >= 2) {
                const alertMsg = `<b>${studentId}</b> 在 Level ${currentLevel} 連續答錯 ${mistakes} 次，可能未掌握「分配性質」技巧。`;
                if (!teacherAlerts.includes(alertMsg)) {
                    teacherAlerts.push(alertMsg);
                }
            }
        }
    }

    // 支援 Enter 鍵提交
    function handleEnter(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    }

    // 更新教師數據端
    function updateTeacherDashboard() {
        const alertsArea = document.getElementById('alerts-area');
        
        if (teacherAlerts.length === 0) {
            alertsArea.innerHTML = "<div class='empty-state'>✅ 目前無異常名單，所有學生皆在正常進度內。</div>";
        } else {
            alertsArea.innerHTML = teacherAlerts.map(alert => `<div class="alert-item">${alert}</div>`).join('');
        }
    }
</script>

</body>
</html>
