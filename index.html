<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSROOM SIGNAL / LIVE</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; background-color: #1a1f35; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* 頂部橘色邊條 */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background-color: #f3704b; }
        
        .main-container { width: 1100px; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        /* 標題區 */
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #8f95b2; }
        
        .dashboard-grid { display: flex; gap: 20px; align-items: stretch; }
        
        /* 左側：學生筆跡預覽區 */
        .left-panel { flex: 1; background-color: #272f4b; border-radius: 12px; border: 1px solid #364061; padding: 25px; position: relative; display: flex; flex-direction: column; }
        .status-badge { position: absolute; top: 20px; right: 20px; background-color: #f3704b; color: white; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .status-badge.active { opacity: 1; }
        
        .preview-title { color: #a4abbe; font-size: 15px; margin-bottom: 30px; }
        .equation-area { font-size: 24px; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        
        /* 輸入框完美融入背景 */
        input[type="number"] { background: transparent; border: none; border-bottom: 2px solid #f3704b; color: #f3704b; font-size: 26px; width: 100px; text-align: center; outline: none; padding: 0 5px; font-weight: bold; }
        /* 模擬游標閃爍 */
        .cursor-indicator { color: #f3704b; font-size: 20px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 右側：數據與警報區 */
        .right-panel { width: 450px; display: flex; flex-direction: column; gap: 15px; }
        .data-stream-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background-color: #1e2439; border-radius: 8px; padding: 15px; }
        .stat-title { color: #8f95b2; font-size: 12px; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .text-orange { color: #f3704b; }
        
        /* 底部白色預警卡片 */
        .alert-card { background-color: #ffffff; border-radius: 12px; padding: 25px; color: #333; flex-grow: 1; display: flex; flex-direction: column; opacity: 0.3; transition: opacity 0.3s; }
        .alert-card.active { opacity: 1; }
        .alert-title { color: #e74c3c; font-size: 16px; font-weight: bold; margin-bottom: 12px; margin-top: 0; }
        .alert-desc { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 15px; }
        .alert-hint { font-size: 14px; font-weight: bold; color: #111; }
    </style>
</head>
<body>
    <div class="top-bar"></div>
    <div class="main-container">
        <div class="header">
            <h1>CLASSROOM SIGNAL / LIVE</h1>
            <p id="sub-header">Q1 · 乘減混合計算 (錯誤率: 0%)</p>
        </div>
        
        <div class="dashboard-grid">
            <!-- 左側：學生答題實況 -->
            <div class="left-panel">
                <div class="status-badge" id="top-badge">偵測到思考滯留中...</div>
                <div class="preview-title">[學生筆跡軌跡預覽]</div>
                <div class="equation-area">
                    <span id="q-text">13 × 8 - 13 × 5</span> = <input type="number" id="ans-input" oninput="checkRealTime()" onkeypress="if(event.key==='Enter') submitAnswer()"> <span class="cursor-indicator">|</span>
                </div>
                <p style="margin-top:40px; color:#5c6585; font-size:13px;">* 於橫線輸入答案並按 Enter 提交</p>
            </div>
            
            <!-- 右側：監測數據流 -->
            <div class="right-panel">
                <div class="data-stream-title">AI 實時監測數據流</div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">連續答對 (Streak)</div>
                        <div class="stat-value" id="stat-streak">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">當前思考停頓</div>
                        <div class="stat-value text-orange" id="stat-time">0.0 秒</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">累積答錯次數</div>
                        <div class="stat-value" id="stat-mistakes">0 次</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">當前難度評級</div>
                        <div class="stat-value text-orange" id="stat-level">Level 1</div>
                    </div>
                </div>
                
                <!-- 預警提示框 -->
                <div class="alert-card" id="alert-box">
                    <h3 class="alert-title" id="alert-title">認知阻塞預警</h3>
                    <div class="alert-desc" id="alert-desc">等待數據分析中...</div>
                    <div class="alert-hint" id="alert-hint"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    let currentLevel = 1; 
    let streak = 0;
    let mistakes = 0;
    let totalMistakes = 0;
    let correctAnswer = 0;
    let currentType = 1; // 預設先出 13x8-13x5
    let startTime = Date.now();
    let timerInterval;

    const ui = {
        qText: document.getElementById('q-text'),
        input: document.getElementById('ans-input'),
        time: document.getElementById('stat-time'),
        streak: document.getElementById('stat-streak'),
        mistakes: document.getElementById('stat-mistakes'),
        level: document.getElementById('stat-level'),
        badge: document.getElementById('top-badge'),
        alertBox: document.getElementById('alert-box'),
        alertTitle: document.getElementById('alert-title'),
        alertDesc: document.getElementById('alert-desc'),
        alertHint: document.getElementById('alert-hint')
    };

    function startTimer() {
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;
            ui.time.innerText = elapsed.toFixed(1) + ' 秒';
            
            // 實作痛點 3：耗時超過 15 秒觸發預警
            if (elapsed > 15 && document.activeElement === ui.input) {
                triggerAlert('作答耗時過長預警', '學生在當前題目停頓超過 15 秒，可能未掌握速算技巧。', '建議介入觀察，或給予方向引導。');
                ui.badge.innerText = '偵測到思考滯留中...';
                ui.badge.classList.add('active');
            }
        }, 100);
    }

    function generateQuestion() {
        ui.input.value = '';
        ui.input.focus();
        hideAlert();
        startTimer();

        // 輪替三種題型展示功能
        currentType = (currentType + 1) % 3;

        if (currentType === 0) {
            // 無限題庫 A x B + A x C
            let a = Math.floor(Math.random() * 8) + 2;
            let b = Math.floor(Math.random() * 9) + 1;
            let c = 10 - b;
            ui.qText.innerText = `${a} × ${b} + ${a} × ${c}`;
            correctAnswer = a * (b + c);
        } else if (currentType === 1) {
            // 自適應梯級：乘減
            if (currentLevel === 1) {
                ui.qText.innerText = `13 × 8 - 13 × 5`;
                correctAnswer = 13 * (8 - 5);
            } else {
                ui.qText.innerText = `123 × 125 - 43 × 125`;
                correctAnswer = 125 * (123 - 43);
            }
        } else {
            // 特定 99 乘法
            ui.qText.innerText = `99 × 15`;
            correctAnswer = 99 * 15;
        }
    }

    function checkRealTime() {
        // 使用者輸入時隱藏滯留標籤
        if(ui.badge.innerText === '偵測到思考滯留中...') {
            ui.badge.classList.remove('active');
        }
    }

    function triggerAlert(title, desc, hint, isCritical = false) {
        ui.alertBox.classList.add('active');
        ui.alertTitle.innerText = title;
        ui.alertDesc.innerText = desc;
        ui.alertHint.innerText = '建議點撥：「' + hint + '」';
        
        if(isCritical) {
            ui.alertTitle.style.color = '#c0392b';
            ui.alertBox.style.border = '2px solid #e74c3c';
        } else {
            ui.alertTitle.style.color = '#e74c3c';
            ui.alertBox.style.border = 'none';
        }
    }

    function hideAlert() {
        ui.alertBox.classList.remove('active');
        ui.badge.classList.remove('active');
    }

    function submitAnswer() {
        let ans = parseInt(ui.input.value);
        if (isNaN(ans)) return;

        if (ans === correctAnswer) {
            streak++;
            mistakes = 0;
            ui.streak.innerText = streak;
            
            // 實作痛點 2：自適應升級
            if (streak >= 2 && currentLevel === 1) {
                currentLevel = 2;
                streak = 0;
                ui.streak.innerText = streak;
                ui.level.innerText = 'Level 2 (進階)';
                
                ui.badge.innerText = '難度自動升階中...';
                ui.badge.classList.add('active');
                setTimeout(() => ui.badge.classList.remove('active'), 2000);
            }
            generateQuestion();
        } else {
            streak = 0;
            mistakes++;
            totalMistakes++;
            ui.streak.innerText = streak;
            ui.mistakes.innerText = totalMistakes + ' 次';

            ui.badge.innerText = '答題錯誤';
            ui.badge.classList.add('active');

            // 實作痛點 3：連錯 3 次精準標記
            if (mistakes >= 3) {
                triggerAlert('高風險阻塞預警 (連錯3次)', '學生在此知識點連續答錯 3 次，系統已自動暫停難度升級。', '需教師親自介入輔導觀念。', true);
                return;
            }

            // 實作痛點 2：鷹架提示
            if (currentType === 2) {
                triggerAlert('認知阻塞預警', '學生在特定題型 (99 × 某數) 出現計算錯誤。', '試從算式中『自製』整十或整百數，將 99 改寫成 (100-1) 來計算喔！');
            } else if (currentType === 1) {
                triggerAlert('認知阻塞預警', '學生在乘減混合運算發生錯誤。', '試著利用分配性質，抽出共同的數字來相減。');
            } else {
                triggerAlert('認知阻塞預警', '學生在乘加混合運算發生錯誤。', '試著把相乘的數字合併相加，湊成整十或整百。');
            }
            
            ui.input.value = '';
        }
    }

    // 初始化第一章圖的起始狀態
    generateQuestion();
</script>
</body>
</html>
